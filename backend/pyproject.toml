[project]
name = "feature2testcases-backend"
version = "1.0.0"
description = "需求分析与测试用例生成平台后端（FastAPI）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0,<2.0",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[tool.uv]
package = false
